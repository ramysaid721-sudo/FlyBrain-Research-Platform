name: FlyBrain Capability Mesh — Focused Tests

on:
  push:
    branches: ["flybrain-browser-worker-staging"]
    paths:
      - "bridge/**"
      - ".github/workflows/capability-mesh-check.yml"
      - "scripts/apply_chat_bridge.py"
      - "FlyBrain_Research_Platform_Fresh_Install_v0.14.0.zip"
  pull_request:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/capability-mesh-check.yml"
      - "scripts/apply_chat_bridge.py"
      - "FlyBrain_Research_Platform_Fresh_Install_v0.14.0.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract and overlay the supported FlyBrain release
        run: |
          python -m zipfile -e FlyBrain_Research_Platform_Fresh_Install_v0.14.0.zip .release
          python scripts/apply_chat_bridge.py --source .release/FlyBrain_Research_Platform_v0.14.0
      - name: Install FlyBrain test dependencies
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./components/FlyBrain-NOS
      - name: Run capability mesh and MCP tests
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: python -m pytest -q components/FlyBrain-NOS/tests/test_capability_mesh.py components/FlyBrain-NOS/tests/test_mcp_server.py
