name: FlyBrain Cloudflare Worker - Playwright

on:
  push:
    branches: [main, develop]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-playwright.yml"
      - "wrangler.jsonc"
  pull_request:
    branches: [main, develop]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-playwright.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flybrain-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-playwright:
    name: Worker browser and API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-playwright-report
          path: |
            cloudflare-worker/playwright-report/
            cloudflare-worker/test-results/
          if-no-files-found: ignore
          retention-days: 7
