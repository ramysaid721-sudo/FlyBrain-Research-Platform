name: FlyBrain Browser Staging — Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare-browser-staging/**"
      - ".github/workflows/flybrain-browser-staging-check.yml"
  push:
    branches: [flybrain-browser-worker-staging]
    paths:
      - "cloudflare-browser-staging/**"
      - ".github/workflows/flybrain-browser-staging-check.yml"

permissions:
  contents: read

jobs:
  validate-browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-browser-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for provider-router tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test zero-cost provider routing and failover
        working-directory: .
        run: python -m pytest -q bridge/test_browser_provider_router.py
      - name: Install pinned Wrangler dependency
        run: npm install --no-audit --no-fund
      - name: Run browser session security tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate Wrangler bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/flybrain-browser-worker-build
