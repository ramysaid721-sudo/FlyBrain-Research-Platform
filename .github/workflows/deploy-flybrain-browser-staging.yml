name: Deploy FlyBrain Browser Worker (Staging)

on:
  push:
    branches:
      - flybrain-browser-worker-staging
    paths:
      - "cloudflare-browser-staging/**"
      - ".github/workflows/deploy-flybrain-browser-staging.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare-browser-staging/**"
      - ".github/workflows/deploy-flybrain-browser-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flybrain-browser-staging
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and optionally deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-browser-staging
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'flybrain-browser-worker-staging' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker security tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/flybrain-browser-worker-build

      - name: Check Cloudflare deployment credentials
        id: cloudflare-auth
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets to enable deployment."
          fi

      - name: Deploy only the staging Worker
        if: steps.cloudflare-auth.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-browser-staging
          command: deploy
