name: Deploy FlyBrain Browser Worker (Staging)

on:
  push:
    branches:
      - flybrain-browser-worker-staging
    paths:
      - "cloudflare-browser-staging/**"
      - ".github/workflows/deploy-flybrain-browser-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flybrain-browser-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Validate and deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-browser-staging
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: flybrain-browser-worker-staging

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker security tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/flybrain-browser-worker-build

      - name: Deploy only the staging Worker
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/flybrain-browser-worker-staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-browser-staging
          command: deploy
