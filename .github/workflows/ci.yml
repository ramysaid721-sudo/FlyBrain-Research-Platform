name: FlyBrain Research Platform CI

on:
  push:
    branches: [main, develop, "feat/**", "eec/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flybrain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Gemini mock adapter tests
        run: python -m unittest discover -s tests -p 'test_gemini_mock.py' -v

      - name: Extract release source
        run: |
          python -m zipfile -e FlyBrain_Research_Platform_Fresh_Install_v0.14.0.zip .release
          test -d .release/FlyBrain_Research_Platform_v0.14.0
      - name: Apply ChatGPT bridge overlay
        run: python scripts/apply_chat_bridge.py --source .release/FlyBrain_Research_Platform_v0.14.0


      - name: Validate tool lifecycle policy module
        run: |
          python -m py_compile bridge/tool_manager.py bridge/mcp_server.py bridge/eec_orchestrator.py bridge/eec_ledger_client.py api/index.py
          PYTHONPATH=bridge python -c "from tool_manager import ToolLifecycleManager; m=ToolLifecycleManager(); assert m.assess('pip-audit')['status']=='eligible_for_isolated_testing'; assert m.assess('nmap')['status']=='blocked'; assert m.assess('not-allowlisted')['status']=='review_required'; assert m.status()['automatic_installation'] is False; print('TOOL LIFECYCLE POLICY TESTS PASSED')"
          python -m unittest discover -s tests -p 'test_tool_manager.py' -v
          python -m unittest discover -s tests -p 'test_vercel_overlay.py' -v

      - name: Install packages
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./components/URCAL
          python -m pip install -e ./components/FlyBrain-NOS
          python -m pip install -e ./adapters/FlyBrain-URCAL-Adapter

      - name: Run URCAL tests
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: python -m pytest -q components/URCAL/tests

      - name: Run FlyBrain bridge and Browser Use adapter tests
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: python -m pytest -q components/FlyBrain-NOS/tests/test_chat_api.py components/FlyBrain-NOS/tests/test_mcp_server.py components/FlyBrain-NOS/tests/test_browser_use_adapter.py components/FlyBrain-NOS/tests/test_eec_orchestrator.py components/FlyBrain-NOS/tests/test_eec_ledger_client.py

      - name: Run FlyBrain and URCAL integration tests
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: python scripts/run_stack_tests.py --flybrain components/FlyBrain-NOS --urcal components/URCAL

      - name: Compile and verify imports
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: |
          python -m compileall -q components/URCAL/urcal components/FlyBrain-NOS/flybrain_os adapters/FlyBrain-URCAL-Adapter
          python -c "import urcal, flybrain_os, flybrain_urcal_adapter; print('ALL IMPORTS PASSED')"
