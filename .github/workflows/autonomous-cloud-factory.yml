name: FlyBrain Autonomous Cloud Factory

on:
  push:
    branches: ["flybrain-browser-worker-staging"]
    paths:
      - "bridge/**"
      - "scripts/apply_chat_bridge.py"
      - "scripts/cloud_factory_report.py"
      - ".github/workflows/autonomous-cloud-factory.yml"
      - "FlyBrain_Research_Platform_Fresh_Install_v0.14.0.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flybrain-cloud-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-evidence:
    name: Build, test and package evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Extract supported release
        run: |
          python -m zipfile -e FlyBrain_Research_Platform_Fresh_Install_v0.14.0.zip .release
          python scripts/apply_chat_bridge.py --source .release/FlyBrain_Research_Platform_v0.14.0

      - name: Install isolated test dependencies
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./components/FlyBrain-NOS

      - name: Compile repository bridge and scripts
        id: compile
        run: python -m compileall -q bridge scripts

      - name: Run bridge, governance, planner and storage tests
        id: tests
        working-directory: .release/FlyBrain_Research_Platform_v0.14.0
        run: |
          python -m pytest -q \
            components/FlyBrain-NOS/tests/test_capability_mesh.py \
            components/FlyBrain-NOS/tests/test_mcp_server.py \
            components/FlyBrain-NOS/tests/test_service_emulation_governance.py \
            components/FlyBrain-NOS/tests/test_service_emulation_planner.py \
            components/FlyBrain-NOS/tests/test_koofr_webdav_adapter.py

      - name: Write execution evidence
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p factory-evidence
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          compile_outcome = os.getenv("COMPILE_OUTCOME", "not_run")
          test_outcome = os.getenv("TEST_OUTCOME", "not_run")
          payload = {
              "factory": "flybrain-autonomous-cloud-factory",
              "schema_version": 1,
              "commit": os.environ["COMMIT_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "created_at": datetime.now(timezone.utc).isoformat(),
              "compile": compile_outcome,
              "tests": test_outcome,
              "result": "passed" if compile_outcome == "success" and test_outcome == "success" else "not_passed",
              "deployment_performed": False,
              "production_modified": False,
              "paid_services_enabled": False
          }
          with open("factory-evidence/execution-report.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-factory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: factory-evidence/execution-report.json
          if-no-files-found: error
          retention-days: 14
