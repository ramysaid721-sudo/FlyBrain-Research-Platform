name: Deploy FlyBrain staging Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-staging/**"
      - ".github/workflows/deploy-flybrain-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flybrain-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy isolated staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare credentials are present (values are not displayed)."

      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-staging
          command: deploy
